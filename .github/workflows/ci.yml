name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chess_test
          # Throwaway database that exists only for this job and only on its network.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/chess_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app tests tests_live
      - name: Unit and integration tests
        run: pytest
      - name: Audit dependencies
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet pip-audit
          /tmp/audit/bin/pip-audit -r requirements.txt

  matches:
    name: Full matches against a running API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chess_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/chess_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Includes games whose three-minute clocks really run out.
      - run: pytest tests_live -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: match-report
          path: backend/tests_live/match-report.json
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  browser:
    name: Browser tests against the Docker stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    env:
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_RATE_LIMIT_PER_MINUTE=500"
          } > .env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait
      - run: npm ci
        working-directory: frontend
      # Uses the Google Chrome already installed on the runner.
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-traces
          path: frontend/test-results/
          if-no-files-found: ignore
